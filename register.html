<!DOCTYPE html>
<html lang="hy">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE-edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NxDactyl Գրանցվել</title>
  <link rel="stylesheet" href="styles/style.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
  
  <div class="wrapper">
    <form action="">
      <h1>Գրանցվել</h1>
      <div class="input-box">
        <input type="email" placeholder="Էլ. Փոստ" required>
        <i class='bx bxs-envelope' ></i>
      </div>
      <div class="input-box">
        <input type="password" placeholder="Գախտնաբառ" required>
        <i class='bx bxs-lock-alt' ></i>
      </div>
      
      <div class="remember-forgot">
        <label><input type="checkbox"> Հիշիր Ինձ</label>
        <a href="#">Ես համաձայն եմ ծառայությունների մատուցման պայմաններին</a>
      </div>
      
      <button type="submit" class="btn">Գրանցվել</button>
      
      <div class="login-link">
        <p>Արդեն Ունես Հաշիվ? <a href="login.html">Մուտք</a></p>
      </div>
    </form>
  </div>
  
</body>

</html>
